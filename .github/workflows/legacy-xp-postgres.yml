name: Legacy XP native PostgreSQL

on:
  pull_request:
    branches: [inner-main]
    # Draft pull requests also emit opened/synchronize; there is no draft gate.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .github/workflows/legacy-xp-postgres.yml
      - src/app/api/arena/event/**
      - src/app/api/arena/beginner-complete/**
      - src/lib/bty/arena/legacyRewards.server*.ts
      - src/lib/bty/arena/legacyRewardAcknowledgement*.ts
      - src/lib/bty/arena/legacy-xp-atomic.pg.test.ts
      - scripts/legacy-xp-postgres-qa.ts
      - src/domain/rules/xp.ts
      - src/domain/rules/level-tier.ts
      - src/domain/constants.ts
      - supabase/migrations/20260222_000001_arena_core.sql
      - supabase/migrations/20260518000000_increment_weekly_xp_rpc.sql
      - supabase/migrations/20261030175508_restrict_xp_writes_to_server.sql
      - supabase/migrations/20261031222747_legacy_xp_atomic_reward_receipts.sql

permissions:
  contents: read

concurrency:
  group: legacy-xp-postgres-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  native-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: bty_legacy_xp_atomic_qa
          # Disposable service credential; never a repository/environment secret.
          POSTGRES_PASSWORD: legacy-xp-disposable-only
          # Both server and published port match the harness's mandatory guard.
          PGPORT: '55473'
        ports:
          - 127.0.0.1:55473:55473
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -p 55473 -U postgres -d bty_legacy_xp_atomic_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 20
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          package-manager-cache: false

      - name: Install locked dependencies with normal install hooks
        run: npm ci --no-audit --no-fund

      - name: Verify atomic rewards on separate PostgreSQL connections
        env:
          # Literal loopback URL, fixed port/name, fresh container database only.
          LEGACY_XP_TEST_DATABASE_URL: postgresql://postgres:legacy-xp-disposable-only@127.0.0.1:55473/bty_legacy_xp_atomic_qa
          # The connected server reports its Docker bridge address. This opt-in
          # permits RFC1918 only and additionally requires GITHUB_ACTIONS=true.
          LEGACY_XP_TEST_CONTAINER_SERVICE: '1'
        run: |
          set -euo pipefail
          node --import tsx scripts/legacy-xp-postgres-qa.ts --postgres \
            --migration "$GITHUB_WORKSPACE/supabase/migrations/20261031222747_legacy_xp_atomic_reward_receipts.sql" \
            2>&1 | tee legacy-xp-postgres-qa.log

      - name: Preserve SQL verification log and JSON result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: legacy-xp-postgres-${{ github.run_id }}-${{ github.run_attempt }}
          path: legacy-xp-postgres-qa.log
          if-no-files-found: ignore
          retention-days: 7
