# Send T-6h in-app reminder for pending action contracts (deadline approaching) — hourly
# Route: POST /api/cron/action-contract-reminder (pending-only, claim-then-notify at-most-once)

name: Action Contract Reminder (T-6h)

on:
  schedule:
    # Every hour UTC — hourly cadence covers the T-6h window (deadlines are discrete 24/48/72h)
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  reminder:
    name: POST /api/cron/action-contract-reminder
    runs-on: ubuntu-latest
    env:
      DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Call reminder endpoint
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "Missing DEPLOY_URL or CRON_SECRET. Set in repo Secrets (see docs/CI_SECRETS_CRON_E2E.md)."
            exit 1
          fi
          BASE=$(printf '%s' "$DEPLOY_URL" | tr -d '\r\n' | sed 's/[[:space:]]*$//;s#/*$##')
          URL="${BASE}/api/cron/action-contract-reminder"
          echo "POST $URL (Authorization: Bearer <CRON_SECRET>)"
          res=$(curl -sS -w "\n%{http_code}" -X POST "$URL" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json")
          code=$(echo "$res" | tail -n1)
          body=$(echo "$res" | sed '$d')
          echo "$body"
          if [ "$code" != "200" ]; then
            echo "HTTP $code"
            exit 1
          fi
          echo "OK"
