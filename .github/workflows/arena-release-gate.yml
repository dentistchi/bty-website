name: Arena release gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployed-arena:
    if: github.ref == 'refs/heads/inner-main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out the deployed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node 20
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          package-manager-cache: false
      - name: Verify the gate against local HTTP fixtures
        run: node --test scripts/arena-release-gate.test.mjs
      - name: Verify the deployed Arena with the designated fixture
        shell: bash
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          EXPECTED_SHA: ${{ github.sha }}
          ARENA_GATE_MODE: authenticated
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: bash scripts/arena-release-gate.sh | tee "$RUNNER_TEMP/arena-release-gate.log"
      - name: Preserve release evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arena-release-gate-evidence
          path: ${{ runner.temp }}/arena-release-gate.log
          if-no-files-found: error
