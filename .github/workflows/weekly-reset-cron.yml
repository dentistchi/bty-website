# Weekly Reset (Arena) — calls triggerWeeklyReset (snapshot + zero + log).
# Dormant: workflow_dispatch only (no schedule block) per MUT-21B F3-α.
# Schedule activation will be a separate post-launch dispatch.
# Pattern: see .github/workflows/tii-weekly-cron.yml and docs/CI_SECRETS_CRON_E2E.md

name: Weekly Reset (Arena)

on:
  workflow_dispatch:

jobs:
  weekly-reset:
    name: POST /api/cron/weekly-reset
    runs-on: ubuntu-latest
    env:
      # Same value as deploy runtime (OpenNext / Cloudflare Workers / Vercel) — see docs/CI_SECRETS_CRON_E2E.md
      DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Call weekly-reset endpoint
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "Missing DEPLOY_URL or CRON_SECRET. Set in repo Secrets (see docs/CI_SECRETS_CRON_E2E.md)."
            exit 1
          fi
          BASE=$(printf '%s' "$DEPLOY_URL" | tr -d '\r\n' | sed 's/[[:space:]]*$//;s#/*$##')
          URL="${BASE}/api/cron/weekly-reset"
          echo "POST $URL (Authorization: Bearer <CRON_SECRET>)"
          res=$(curl -sS -w "\n%{http_code}" -X POST "$URL" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json")
          code=$(echo "$res" | tail -n1)
          body=$(echo "$res" | sed '$d')
          echo "$body"
          if [ "$code" != "200" ]; then
            echo "HTTP $code"
            exit 1
          fi
          echo "OK"
