name: Reward write fence PostgreSQL

on:
  pull_request:
    # The fence PR is stacked on PR91's branch; both must run this gate.
    branches: [inner-main, fix/legacy-xp-atomicity]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .github/workflows/reward-write-fence-postgres.yml
      - scripts/reward-write-fence-*.ts
      - scripts/reward-write-fence-cutover.mjs
      - scripts/qa/reward-fence-prod-schema*
      - supabase/migrations/**
      - src/lib/bty/arena/**
      - src/lib/bty/healing/**
      - src/lib/bty/foundry/events/**
      - src/app/api/arena/**
      - src/lib/supabase-admin.ts

permissions:
  contents: read

concurrency:
  group: reward-write-fence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fence:
    name: Reward fence — ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: native PostgreSQL
            database: bty_reward_fence_qa
            script: scripts/reward-write-fence-postgres-qa.ts
            url_env: REWARD_FENCE_TEST_DATABASE_URL
            expected_checks: 38
          - suite: PostgREST 14.5
            database: bty_reward_fence_rest
            script: scripts/reward-write-fence-postgrest-qa.ts
            url_env: REWARD_FENCE_REST_DATABASE_URL
            expected_checks: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: ${{ matrix.database }}
          # Disposable service credential; never a repository/environment secret.
          POSTGRES_PASSWORD: reward-fence-disposable-only
          PGPORT: '55491'
        ports:
          - 127.0.0.1:55491:55491
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -p 55491 -U postgres -d ${{ matrix.database }}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 20
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          package-manager-cache: false

      - name: Install locked dependencies with normal install hooks
        run: npm ci --no-audit --no-fund

      - name: Fetch PostgREST v14.5 (production version) and verify its digest
        if: matrix.database == 'bty_reward_fence_rest'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/postgrest"
          gh release download v14.5 -R PostgREST/postgrest -p 'postgrest-v14.5-linux-static-x86-64.tar.xz' -D "$RUNNER_TEMP/postgrest"
          echo "ab5cc7e974d4940447991804588cfb8b3f7b2c57b691f0905df04d51ede69470  $RUNNER_TEMP/postgrest/postgrest-v14.5-linux-static-x86-64.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/postgrest/postgrest-v14.5-linux-static-x86-64.tar.xz" -C "$RUNNER_TEMP/postgrest"
          "$RUNNER_TEMP/postgrest/postgrest" --version
          echo "POSTGREST_BIN=$RUNNER_TEMP/postgrest/postgrest" >> "$GITHUB_ENV"

      - name: Run harness on the disposable service database
        env:
          # The connected server reports its Docker bridge address. This opt-in
          # permits RFC1918 only and additionally requires GITHUB_ACTIONS=true.
          REWARD_FENCE_TEST_CONTAINER_SERVICE: '1'
        run: |
          set -euo pipefail
          export ${{ matrix.url_env }}="postgresql://postgres:reward-fence-disposable-only@127.0.0.1:55491/${{ matrix.database }}"
          node --import tsx "${{ matrix.script }}" --json "$RUNNER_TEMP/result.json" 2>&1 | tee "$RUNNER_TEMP/result.log"

      - name: Fail unless every expected check body executed
        run: |
          set -euo pipefail
          jq -e --argjson n ${{ matrix.expected_checks }} \
            '.result == "pass" and .unrun == [] and (.expectedChecks | length) == $n and (.checks | length) == $n
             and ([.checks[].name] == .expectedChecks)' "$RUNNER_TEMP/result.json"
          test "$(grep -c '^PASS ' "$RUNNER_TEMP/result.log")" -eq ${{ matrix.expected_checks }}

      - name: Preserve result JSON and log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reward-fence-${{ matrix.database }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/result.json
            ${{ runner.temp }}/result.log
          if-no-files-found: error
          retention-days: 14
